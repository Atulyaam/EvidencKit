name: EvidenceKit CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evidencekit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evidencekit
      AUTH_SECRET: ci-test-secret-32-chars-long-minimum-key!
      EVIDENCE_SIGNING_PRIVATE_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Code formatting check
        run: pnpm format:check

      - name: Lint codebase
        run: pnpm lint

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Execute automated unit and property-based tests
        run: pnpm test

      - name: Build applications and shared packages
        run: pnpm build

