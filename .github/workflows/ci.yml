name: EvidenceKit CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Code formatting check
        run: pnpm format:check

      - name: Lint codebase
        run: pnpm lint

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Execute automated unit and property-based tests
        run: pnpm test

      - name: Build applications and shared packages
        run: pnpm build
